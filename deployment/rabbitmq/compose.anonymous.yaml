# NUR zusammen mit compose.internal.yaml verwenden; HOWTO.md zeigt den Start.
# Ersetzt den gesamten Parameterwert aus der Basis-Compose, kein Config-Mount.
services:
  rabbitmq:
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbit auth_mechanisms ['ANONYMOUS']
        -rabbit anonymous_login_user <<"mq-demo">>
        -rabbit anonymous_login_pass <<"mq-demo-password">>
    # AMQP-Client: SASL ANONYMOUS wählen, keinen Benutzer/Passwort übergeben.
    # Interne Identität muss zum initialisierten Benutzer aus der Basis passen.
